[project]
name = "alchemist"
version = "0.1.0"
description = "Screen automation helper for the Tree of Savior: Neverland alchemist."
requires-python = ">=3.11"
dependencies = [
    "pyautogui",
    "opencv-python",
    "numpy",
    "pillow",
]

[project.scripts]
alchemist = "alchemist.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alchemist*"]
